services:
  # Nginx reverse proxy
  nginx:
    image: nginx:alpine
    container_name: intent-ai-nginx
    ports:
      - "80:80"
      - "443:443"
    environment:
      DOMAIN: ${DOMAIN}
      NGINX_ENVSUBST_FILTER: DOMAIN
    volumes:
      - ./nginx/nginx.conf.template:/etc/nginx/templates/default.conf.template:ro
      - letsencrypt:/etc/letsencrypt:ro
      - certbot_webroot:/var/www/certbot:ro
    depends_on:
      - frontend
      - backend
      - memzero
    networks:
      - intent-ai
    restart: unless-stopped

  # Certbot — issues and auto-renews the Let's Encrypt certificate
  certbot:
    image: certbot/certbot
    container_name: intent-ai-certbot
    volumes:
      - letsencrypt:/etc/letsencrypt
      - certbot_webroot:/var/www/certbot
    entrypoint: "/bin/sh -c 'trap exit TERM; while :; do certbot renew; sleep 12h & wait $${!}; done;'"
    restart: unless-stopped

  # Next.js frontend
  frontend:
    build:
      context: apps/frontend
      dockerfile: Dockerfile
      args:
        NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-}
    container_name: intent-ai-frontend
    environment:
      BACKEND_URL: http://backend:8000
      MEMZERO_URL: http://memzero:8000
    networks:
      - intent-ai
    restart: unless-stopped

  # FastAPI backend (API gateway + scheduler)
  backend:
    build:
      context: .
      dockerfile: apps/backend/Dockerfile
    container_name: intent-ai-backend
    env_file:
      - .env
    environment:
      MEMZERO_API_URL: http://memzero:8000
      RABBITMQ_HOST: rabbitmq
      RABBITMQ_PORT: 5672
      RABBITMQ_USER: ${RABBITMQ_USER:-guest}
      RABBITMQ_PASSWORD: ${RABBITMQ_PASSWORD:-guest}
      GOAL_EVAL_ENABLED: ${GOAL_EVAL_ENABLED:-true}
      NUDGE_ENABLED: ${NUDGE_ENABLED:-true}
      SUGGESTIONS_ENABLED: ${SUGGESTIONS_ENABLED:-true}
      SUGGESTIONS_INTERVAL_HOURS: ${SUGGESTIONS_INTERVAL_HOURS:-24}
      CORS_ORIGINS: ${CORS_ORIGINS:-*}
    depends_on:
      rabbitmq:
        condition: service_healthy
      memzero:
        condition: service_healthy
    networks:
      - intent-ai
    restart: unless-stopped

  # Memzero API (users, goals, check-ins, memories)
  memzero:
    build:
      context: apps/memzero
      dockerfile: Dockerfile
    container_name: intent-ai-memzero
    volumes:
      - /home/ec2-user/intent_ai/docs:/app/docs    
    env_file:
      - .env
    environment:
      POSTGRES_HOST: ${POSTGRES_HOST:-postgres}
      POSTGRES_PORT: ${POSTGRES_PORT:-5432}
      POSTGRES_USER: ${POSTGRES_USER:-mem0user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-mem0password}
      POSTGRES_DB: ${POSTGRES_DB:-mem0db}
      DATABASE_URL: ${DATABASE_URL:-postgresql://mem0user:mem0password@postgres:5432/mem0db}
      QDRANT_HOST: qdrant
      QDRANT_PORT: 6333
      QDRANT_COLLECTION: ${QDRANT_COLLECTION:-mem0_memories}
      REDIS_HOST: redis
      REDIS_PORT: 6379
      REDIS_ENABLED: ${REDIS_ENABLED:-true}
      LLM_PROVIDER: aws_bedrock
      LLM_MODEL: ${LLM_MODEL:-us.anthropic.claude-3-5-haiku-20241022-v1:0}
      AWS_REGION: ${AWS_REGION:-us-west-2}
      EMBEDDER_PROVIDER: aws_bedrock
      EMBEDDER_MODEL: ${EMBEDDER_MODEL:-amazon.titan-embed-text-v2:0}
      EMBEDDER_DIMS: ${EMBEDDER_DIMS:-1024}
      JWT_SECRET_KEY: ${JWT_SECRET_KEY:-change-me-in-production}
      CORS_ORIGINS: ${CORS_ORIGINS:-*}
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s
    depends_on:
      qdrant:
        condition: service_started
      redis:
        condition: service_healthy
    networks:
      - intent-ai
    restart: unless-stopped

  # RabbitMQ message broker
  rabbitmq:
    image: rabbitmq:3-management
    container_name: intent-ai-rabbitmq
    environment:
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_USER:-guest}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_PASSWORD:-guest}
    volumes:
      - rabbitmq_data:/var/lib/rabbitmq
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s
    networks:
      - intent-ai
    restart: unless-stopped

  # Agent worker (consumes RabbitMQ, calls Bedrock)
  worker:
    build:
      context: .
      dockerfile: apps/workers/Dockerfile
    container_name: intent-ai-worker
    env_file:
      - .env
    environment:
      RABBITMQ_HOST: rabbitmq
      RABBITMQ_PORT: 5672
      RABBITMQ_USER: ${RABBITMQ_USER:-guest}
      RABBITMQ_PASSWORD: ${RABBITMQ_PASSWORD:-guest}
      LLM_PROVIDER: ${LLM_PROVIDER:-bedrock}
      BEDROCK_MODEL: ${BEDROCK_MODEL:-us.anthropic.claude-3-5-haiku-20241022-v1:0}
      AWS_REGION: ${AWS_REGION:-us-west-2}
      MEMZERO_API_URL: http://memzero:8000
    depends_on:
      rabbitmq:
        condition: service_healthy
    networks:
      - intent-ai
    restart: unless-stopped

  # Qdrant vector database (on EBS volume in prod)
  qdrant:
    image: qdrant/qdrant:v1.12.5
    container_name: intent-ai-qdrant
    volumes:
      - ${QDRANT_DATA_PATH:-qdrant_data}:/qdrant/storage
    networks:
      - intent-ai
    restart: unless-stopped

  # Redis cache
  redis:
    image: redis:7-alpine
    container_name: intent-ai-redis
    command: redis-server --appendonly yes
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - intent-ai
    restart: unless-stopped

volumes:
  rabbitmq_data:
  qdrant_data:
  redis_data:
  letsencrypt:
  certbot_webroot:

networks:
  intent-ai:
    driver: bridge
